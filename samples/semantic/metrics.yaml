# 全局指标（neo-cloud 真实口径）——OSI 式口径：expression + aggregation
# + filter 机器可读（ADR-0001；指标 FQN = 单段名字，全局唯一）。
#
# 约定：
#   - expression = SQL 表达式（编译期校验可解析）；
#   - filter = 固定过滤条件（时间过滤是查询参数，不进定义）；
#   - tables = 指标依赖的底层表（describes 边 + 指标授权展开的依据）。
#
# 指标沉淀路径（US-15/16）：Agent 起草 → 服务负责人（bss-wallet）确认
# 后回写本文件 → 编译进运行时；dry-run 展开验证（get_metric_definition
# 带时间参数展开，不执行）。
version: 1
metrics:
  - name: payment_failure_rate
    description: 支付失败率——状态为支付失败（status=4，FAILED）的支付单占全部支付单的比例；时间过滤是查询参数（按支付单创建时间 created_at 半开区间展开，不进定义）
    expression: "COUNT(*) FILTER (WHERE status = 4)::numeric / NULLIF(COUNT(*), 0)"
    aggregation: ratio
    filter: ""
    tables:
      - bss-wallet.wallet.payment_orders
