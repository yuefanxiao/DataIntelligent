# 支付服务（样例）
version: 1
service: payment-service
description: 支付服务——支付单、支付流水与退款，覆盖「昨天支付失败率为什么上涨」主用例的表层
databases:
  - name: payment_db
    description: 支付库
    tables:
      - name: payments
        description: 支付单
        columns:
          - name: id
            type: uuid
            description: 支付单主键
          - name: order_id
            type: uuid
            description: 关联订单 ID
          - name: status
            type: varchar
            description: 支付状态（枚举挂列：list_enum_values 的数据来源）
            enum_values:
              - value: pending
                label: 待支付
              - value: succeeded
                label: 支付成功
              - value: failed
                label: 支付失败
              - value: refunded
                label: 已退款
          - name: amount
            type: numeric
            description: 支付金额（元）
          - name: created_at
            type: timestamptz
            is_time: true
            description: 支付创建时间（时间轴标注，时间过滤的挂载点）
        references:
          - to: order-service.order_db.orders
            on: "payments.order_id = orders.id"
