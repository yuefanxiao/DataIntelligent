# v1 验收用例（build 12：负向/边界 5 例 + 正向基础例；build 14：主用例 +
# 13 服务用例矩阵；spec §5 测试决策主 seam、§6.1-§6.5）。
#
# 只测外部行为（spec §5 测试哲学：不测实现细节）：用例 = 工具调用 + 期望
# 断言，经官方 go-sdk 客户端打网关（HTTP + stdio 双形态真实 MCP 往返）。
# 用例兼作 golden 语料（09 采集回归复用，docs/acceptance-cases.md 记录
# 复用契约）。
#
# 字段：
#   id/name      稳定标识 + 一句话描述（报告与执行记录关联）
#   modes        适用形态（http/stdio）。stdio = 单 key 单进程：多身份用例
#                （无 grants 用户、进程级并发）仅 http，架构使然（README 说明）
#   tool/args    工具调用与参数（MCP 工具协议层）
#   key          用哪把 key（= 绑定用户；缺省 dev-alice；--keys 传明文映射）
#   keys         并发用例的 key 列表（每个 key 发 concurrency 个调用）
#   concurrency  并发调用数（>1 = 并发用例：独立会话同时发出，不排队验证）
#   sqls         同期望的多语句列表（非 SELECT 拒绝集；每句一条调用）
#   steps        流程用例步骤（主用例 / 无指标原料路径）；每步 = {tool, args, expect}
#   replay_skip  并发用例标记：顺序重放无法复现并发拒绝（闸在时间窗口内
#                饱和），重放时跳过状态比对（执行记录仍在链上）
#   expect       期望断言：
#     status           success / rejected
#     kind             rejected 时的 gwerr kind（机器可区分）
#     reason           rejected 时的 details.reason（机器可区分）
#     rows/truncated   execute_sql 成功结果的精确行数 / 截断标记
#     paths            结果 JSON 路径断言 [{path, eq}]（语义工具结果等）
#     psql_compare     三件套 (a)：结果与 psql 同库同 SQL 逐项一致
#     status_multiset  并发用例：{success: n, rejected: m}
#     rejected_reason  并发用例被拒调用的 details.reason
version: 1
cases:
  # ── 正向基础例（三件套断言的对照基础）──────────────────────────────────
  - id: pos-001
    name: 单表分组聚合（psql 对照基础；status 枚举分组）
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT status, count(*) AS n FROM orders GROUP BY status ORDER BY n DESC"
      dbname: bill
    expect:
      status: success
      rows: 2
      truncated: false
      psql_compare: true
  - id: pos-002
    name: 数值过滤 + 聚合（amount > 100 → 534 行，确定性边界外）
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT count(*) AS n FROM orders WHERE amount > 100"
      dbname: bill
    expect:
      status: success
      rows: 1
      truncated: false
      psql_compare: true
  - id: pos-003
    name: 时间列输出 + LIMIT 3（timestamptz 归一化对照）
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT id, status, amount, paid_at FROM orders ORDER BY id LIMIT 3"
      dbname: bill
    expect:
      status: success
      rows: 3
      truncated: false
      psql_compare: true

  # ── §6.1 主用例「昨天支付失败率为什么上涨」全流程（build 14）──────────
  # Agent 自由组合（不预设 SQL）：双入口定位（概念入口 + 指标入口都按
  # FQN 断言）→ 口径 + 带时间参数 dry-run 展开 → 昨日趋势 → 下钻归因
  # （多表 join + 窗口函数 + 时间窗口 + CTE，覆盖校验层硬路径）。
  # 数据故事（fixture.sql）：此前 13 天失败率 3/60 = 5%，昨日 43/100 =
  # 43% 激增——失败集中 channel=5 银行转账（下钻里该渠道 failed 3 → 40，
  # delta=37）。趋势/归因 SQL 用相对时间窗口（昨天 = date_trunc('day',
  # now()) - interval '1 day'），重放同日可复现。
  # dry-run 断言用固定窗口（2026-08-11T00:00:00Z → 08-12）：展开是纯函数，
  # 固定入参 = 确定性输出，精确断言展开 SQL 全文（口径改动即用例失败）。
  - id: main-001
    name: 主用例——昨天支付失败率为什么上涨（搜索→口径→趋势→下钻归因）
    modes: [http, stdio]
    key: dev-alice
    steps:
      - tool: search_entities
        args:
          query: "支付失败"
        expect:
          status: success
          paths:
            - path: total
              eq: 2
      - tool: search_entities
        args:
          query: "支付失败"
          type: concept
        expect:
          status: success
          paths:
            - path: total
              eq: 1
            - path: hits[0].fqn
              eq: payment_failure
      - tool: search_entities
        args:
          query: "支付失败"
          type: metric
        expect:
          status: success
          paths:
            - path: total
              eq: 1
            - path: hits[0].fqn
              eq: payment_failure_rate
      - tool: get_metric_definition
        args:
          fqn: payment_failure_rate
          time_range:
            start: "2026-08-11T00:00:00Z"
            end: "2026-08-12T00:00:00Z"
        expect:
          status: success
          paths:
            - path: time_applied
              eq: true
            - path: tables[0]
              eq: bss-wallet.wallet.payment_orders
            - path: dry_run_sql
              eq: "SELECT COUNT(*) FILTER (WHERE status = 4)::numeric / NULLIF(COUNT(*), 0) AS payment_failure_rate FROM payment_orders WHERE payment_orders.created_at >= '2026-08-11T00:00:00Z' AND payment_orders.created_at < '2026-08-12T00:00:00Z'"
      - tool: execute_sql
        args:
          sql: "SELECT date_trunc('day', created_at)::date AS d, count(*) FILTER (WHERE status = 4)::numeric / NULLIF(count(*), 0) AS failure_rate FROM payment_orders WHERE created_at >= date_trunc('day', now()) - interval '7 day' AND created_at < date_trunc('day', now()) GROUP BY 1 ORDER BY 1"
          dbname: wallet
        expect:
          status: success
          rows: 7
          truncated: false
          psql_compare: true
      - tool: execute_sql
        args:
          sql: "WITH daily AS (SELECT date_trunc('day', p.created_at)::date AS d, p.channel, count(*) FILTER (WHERE p.status = 4) AS failed, count(*) AS total FROM payment_orders p JOIN wallet_accounts a ON p.org_id = a.org_id WHERE p.created_at >= date_trunc('day', now()) - interval '3 day' AND p.created_at < date_trunc('day', now()) GROUP BY 1, 2) SELECT d, channel, failed, total, failed::numeric / NULLIF(total, 0) AS rate, failed - lag(failed) OVER (PARTITION BY channel ORDER BY d) AS delta FROM daily ORDER BY d, channel"
          dbname: wallet
        expect:
          status: success
          rows: 8
          truncated: false
          psql_compare: true

  # ── §6.2 每服务用例矩阵（13 服务 × ≥2 简单 + ≥1 复杂，39 例；build 14）
  # 10 个持库服务 = execute_sql 用例（fixture.sql 伪造数据）；3 个无持库
  # 服务（聚合/编排/采集角色）= 语义元数据用例（服务实体可达 + 拓扑如
  # 实，docs/acceptance-cases.md 记录口径）。全部复杂用例 = 多表 join/
  # 窗口函数/时间窗口，并覆盖校验层硬路径（AST 分类与授权展开）：
  # CTE = bill-003 / main-001 步骤 6；子查询 = audit-003。
  #
  # ── bss-bill（db=bill）────────────────────────────────────────────────
  - id: bill-001
    name: bss-bill 简单——账单时间窗口聚合（近 7 日按天 sum(bill_amount)）
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT date_trunc('day', request_started_at)::date AS d, sum(bill_amount) AS total FROM bills WHERE request_started_at >= date_trunc('day', now()) - interval '7 day' AND request_started_at < date_trunc('day', now()) GROUP BY 1 ORDER BY 1"
      dbname: bill
    expect:
      status: success
      rows: 7
      truncated: false
      psql_compare: true
  - id: bill-002
    name: bss-bill 简单——结算批次枚举状态聚合
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT status, count(*) AS n FROM settlement_batches GROUP BY status ORDER BY status"
      dbname: bill
    expect:
      status: success
      rows: 3
      truncated: false
      psql_compare: true
  - id: bill-003
    name: bss-bill 复杂——结算扣费失败归因（CTE + LEFT JOIN + 时间窗口）
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "WITH attempts AS (SELECT settlement_batch_id, count(*) FILTER (WHERE status = 'failed') AS failed FROM settlement_attempts GROUP BY settlement_batch_id) SELECT b.status, count(*) AS batches, coalesce(sum(a.failed), 0) AS failed_attempts FROM settlement_batches b LEFT JOIN attempts a ON b.settlement_batch_id = a.settlement_batch_id WHERE b.settlement_cycle_started_at >= date_trunc('day', now()) - interval '7 day' AND b.settlement_cycle_started_at < date_trunc('day', now()) GROUP BY b.status ORDER BY b.status"
      dbname: bill
    expect:
      status: success
      rows: 3
      truncated: false
      psql_compare: true

