  # ── §6.3 负向例 1：未授权表拒绝 ────────────────────────────────────────
  - id: neg-001a
    name: 未授权表拒绝——无 grants 测试用户（ghost）访问已存在表
    modes: [http]
    tool: execute_sql
    key: ghost
    args:
      sql: "SELECT count(*) FROM orders"
      dbname: bill
    expect:
      status: rejected
      kind: permission_denied
      reason: not_granted
  - id: neg-001b
    name: 未授权表拒绝——有角色只读权但无表授权（dev-alice 查 iam.users）
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT id, name FROM users"
      dbname: iam
    expect:
      status: rejected
      kind: permission_denied
      reason: not_granted
  # 「错误区分无权限表」的另一面：语法层引用无法映射到授权 FQN（非 public
  # schema）→ unknown_table，与 not_granted 机器可区分。
  - id: neg-001c
    name: 未授权表拒绝——无法映射 FQN 的引用区分 unknown_table
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT count(*) FROM bill.orders"
      dbname: bill
    expect:
      status: rejected
      kind: permission_denied
      reason: unknown_table
  # 授权展开的负向（spec §6.2 校验层硬路径的安全方向）：多表引用不是只
  # 查首表——CTE 体里的未授权表也必须被拒绝（authorize 逐表展开）。
  # 正向覆盖在矩阵复杂用例（join/CTE/子查询全授权表），这里补「展开
  # 少查表」回归：校验层若退化为只查首表，本用例会从 not_granted 变成
  # 成功，立即暴露。
  - id: neg-006
    name: 授权展开负向——CTE 引用未授权表（多表引用逐表展开，非只查首表）
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "WITH u AS (SELECT id FROM users) SELECT count(*) AS n FROM organizations o JOIN u ON o.owner_user_id = 'user-' || u.id"
      dbname: iam
    expect:
      status: rejected
      kind: permission_denied
      reason: not_granted

  # ── §6.3 负向例 2：非 SELECT 拒绝（AST 分类拒绝集）─────────────────────
  - id: neg-002
    name: 非 SELECT 拒绝——DML/DDL/COPY/utility 一律 AST 分类拒绝
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      dbname: bill
    sqls:
      - "UPDATE orders SET status = 'paid' WHERE id = 1"
      - "DELETE FROM orders WHERE id = 1"
      - "INSERT INTO orders (id, status) VALUES (999999, 'paid')"
      - "CREATE TABLE t_accept (id int)"
      - "COPY orders TO STDOUT"
      - "EXPLAIN SELECT count(*) FROM orders"
    expect:
      status: rejected
      kind: invalid_request
      reason: non_select

  # ── §6.3 负向例 3：LIMIT 截断 ──────────────────────────────────────────
  # trunc-001：默认上限 500（http 网关不设 DGW_SQL_LIMIT，走 §4.9 默认
  # 值路径）；big_events 6000 行 → 500 行 + truncated。psql 对照用有界
  # 查询（LIMIT 500）——「返回的行与 psql 一致」。
  - id: trunc-001
    name: LIMIT 截断——>500 行结果截断 + truncated 标记（默认上限）
    modes: [http]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT * FROM big_events ORDER BY id"
      dbname: bill
    expect:
      status: success
      rows: 500
      truncated: true
      psql_compare: true
  # trunc-002：硬上限 5000（stdio 网关 DGW_SQL_LIMIT=5000）；big_events
  # 6000 行 → 5000 行 + truncated（§4.9「硬上限 5000 不可配置超过」；
  # 配置边界 5001 拒启由 run.sh 环境检查验证）。
  - id: trunc-002
    name: LIMIT 截断——>5000 硬上限行为正确（上限配置 5000）
    modes: [stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT * FROM big_events ORDER BY id"
      dbname: bill
    expect:
      status: success
      rows: 5000
      truncated: true
      psql_compare: true

  # ── §6.3 负向例 4：并发超限（不排队、结构化拒绝）──────────────────────
  # 慢查询持闸 2s 保证窗口内确定性；被拒 = 闸在查询执行前（连校验都不做）。
  - id: conc-001
    name: 并发超限——同 key 并发 >2 结构化拒绝（key_concurrency_limit）
    modes: [http]
    tool: execute_sql
    key: dev-alice
    concurrency: 3
    args:
      sql: "SELECT pg_sleep(2), count(*) AS n FROM orders"
      dbname: bill
    expect:
      status_multiset:
        success: 2
        rejected: 1
      rejected_reason: key_concurrency_limit
      # 不排队：被拒调用在闸处快速失败（毫秒级），远快于慢查询持闸 2s。
      reject_within_ms: 1000
    replay_skip: true
  - id: conc-002
    name: 并发超限——进程级 >8 结构化拒绝（process_concurrency_limit，5 key × 2）
    modes: [http]
    tool: execute_sql
    keys: [p1, p2, p3, p4, p5]
    concurrency: 2
    args:
      sql: "SELECT pg_sleep(2), count(*) AS n FROM orders"
      dbname: bill
    expect:
      status_multiset:
        success: 8
        rejected: 2
      rejected_reason: process_concurrency_limit
      reject_within_ms: 1000
    replay_skip: true

  # ── §6.3 负向例 5：无指标原料路径 ─────────────────────────────────────
  # build 14 起验收环境带语义数据（run.sh semantic-sync 同步 samples/
  # semantic）——「无指标」不能依赖全局空存储，换「无指标领域」fixture
  # （README/用例清单记录隔离策略）：退款域只有概念无指标（metrics.yaml
  # 仅 payment_failure_rate），search_entities(type=metric, 退款) 零命中
  # → Agent 走表/列原料路径直查退款单成功产出结果。
  - id: neg-005
    name: 无指标原料路径——退款域无现成指标，Agent 走表/列原料路径直查退款单产出结果
    modes: [http, stdio]
    key: dev-alice
    steps:
      - tool: search_entities
        args:
          query: "退款"
          type: metric
        expect:
          status: success
          paths:
            - path: total
              eq: 0
      - tool: execute_sql
        args:
          sql: "SELECT status, count(*) AS n FROM refund_orders GROUP BY status ORDER BY status"
          dbname: wallet
        expect:
          status: success
          rows: 3
          truncated: false
          psql_compare: true
