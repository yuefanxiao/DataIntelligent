# v1 验收用例（build 12：负向/边界 5 例 + 正向基础例；spec §5 测试决策主
# seam、§6.3 负向/边界、§6.4 判定三件套、§6.5 执行方式）。
#
# 只测外部行为（spec §5 测试哲学：不测实现细节）：用例 = 工具调用 + 期望
# 断言，经官方 go-sdk 客户端打网关（HTTP + stdio 双形态真实 MCP 往返）。
# 13 服务用例矩阵（§6.2，39+ 例）在 build 14 扩展——本文件即那个矩阵的
# 框架，build 14 只增用例不改 harness。
#
# 字段：
#   id/name      稳定标识 + 一句话描述（报告与执行记录关联）
#   modes        适用形态（http/stdio）。stdio = 单 key 单进程：多身份用例
#                （无 grants 用户、进程级并发）仅 http，架构使然（README 说明）
#   tool/args    工具调用与参数（MCP 工具协议层）
#   key          用哪把 key（= 绑定用户；缺省 dev-alice；--keys 传明文映射）
#   keys         并发用例的 key 列表（每个 key 发 concurrency 个调用）
#   concurrency  并发调用数（>1 = 并发用例：独立会话同时发出，不排队验证）
#   sqls         同期望的多语句列表（非 SELECT 拒绝集；每句一条调用）
#   steps        流程用例步骤（无指标原料路径等）；每步 = {tool, args, expect}
#   replay_skip  并发用例标记：顺序重放无法复现并发拒绝（闸在时间窗口内
#                饱和），重放时跳过状态比对（执行记录仍在链上）
#   expect       期望断言：
#     status           success / rejected
#     kind             rejected 时的 gwerr kind（机器可区分）
#     reason           rejected 时的 details.reason（机器可区分）
#     rows/truncated   execute_sql 成功结果的精确行数 / 截断标记
#     paths            结果 JSON 路径断言 [{path, eq}]（语义工具结果等）
#     psql_compare     三件套 (a)：结果与 psql 同库同 SQL 逐项一致
#     status_multiset  并发用例：{success: n, rejected: m}
#     rejected_reason  并发用例被拒调用的 details.reason
version: 1
cases:
  # ── 正向基础例（三件套断言的对照基础）──────────────────────────────────
  - id: pos-001
    name: 单表分组聚合（psql 对照基础；status 枚举分组）
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT status, count(*) AS n FROM orders GROUP BY status ORDER BY n DESC"
      dbname: bill
    expect:
      status: success
      rows: 2
      truncated: false
      psql_compare: true
  - id: pos-002
    name: 数值过滤 + 聚合（amount > 100 → 534 行，确定性边界外）
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT count(*) AS n FROM orders WHERE amount > 100"
      dbname: bill
    expect:
      status: success
      rows: 1
      truncated: false
      psql_compare: true
  - id: pos-003
    name: 时间列输出 + LIMIT 3（timestamptz 归一化对照）
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT id, status, amount, paid_at FROM orders ORDER BY id LIMIT 3"
      dbname: bill
    expect:
      status: success
      rows: 3
      truncated: false
      psql_compare: true

  # ── §6.3 负向例 1：未授权表拒绝 ────────────────────────────────────────
  - id: neg-001a
    name: 未授权表拒绝——无 grants 测试用户（ghost）访问已存在表
    modes: [http]
    tool: execute_sql
    key: ghost
    args:
      sql: "SELECT count(*) FROM orders"
      dbname: bill
    expect:
      status: rejected
      kind: permission_denied
      reason: not_granted
  - id: neg-001b
    name: 未授权表拒绝——有角色只读权但无表授权（dev-alice 查 iam.users）
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT id, name FROM users"
      dbname: iam
    expect:
      status: rejected
      kind: permission_denied
      reason: not_granted
  # 「错误区分无权限表」的另一面：语法层引用无法映射到授权 FQN（非 public
  # schema）→ unknown_table，与 not_granted 机器可区分。
  - id: neg-001c
    name: 未授权表拒绝——无法映射 FQN 的引用区分 unknown_table
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT count(*) FROM bill.orders"
      dbname: bill
    expect:
      status: rejected
      kind: permission_denied
      reason: unknown_table

  # ── §6.3 负向例 2：非 SELECT 拒绝（AST 分类拒绝集）─────────────────────
  - id: neg-002
    name: 非 SELECT 拒绝——DML/DDL/COPY/utility 一律 AST 分类拒绝
    modes: [http, stdio]
    tool: execute_sql
    key: dev-alice
    args:
      dbname: bill
    sqls:
      - "UPDATE orders SET status = 'paid' WHERE id = 1"
      - "DELETE FROM orders WHERE id = 1"
      - "INSERT INTO orders (id, status) VALUES (999999, 'paid')"
      - "CREATE TABLE t_accept (id int)"
      - "COPY orders TO STDOUT"
      - "EXPLAIN SELECT count(*) FROM orders"
    expect:
      status: rejected
      kind: invalid_request
      reason: non_select

  # ── §6.3 负向例 3：LIMIT 截断 ──────────────────────────────────────────
  # trunc-001：默认上限 500（http 网关不设 DGW_SQL_LIMIT，走 §4.9 默认
  # 值路径）；big_events 6000 行 → 500 行 + truncated。psql 对照用有界
  # 查询（LIMIT 500）——「返回的行与 psql 一致」。
  - id: trunc-001
    name: LIMIT 截断——>500 行结果截断 + truncated 标记（默认上限）
    modes: [http]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT * FROM big_events ORDER BY id"
      dbname: bill
    expect:
      status: success
      rows: 500
      truncated: true
      psql_compare: true
  # trunc-002：硬上限 5000（stdio 网关 DGW_SQL_LIMIT=5000）；big_events
  # 6000 行 → 5000 行 + truncated（§4.9「硬上限 5000 不可配置超过」；
  # 配置边界 5001 拒启由 run.sh 环境检查验证）。
  - id: trunc-002
    name: LIMIT 截断——>5000 硬上限行为正确（上限配置 5000）
    modes: [stdio]
    tool: execute_sql
    key: dev-alice
    args:
      sql: "SELECT * FROM big_events ORDER BY id"
      dbname: bill
    expect:
      status: success
      rows: 5000
      truncated: true
      psql_compare: true

  # ── §6.3 负向例 4：并发超限（不排队、结构化拒绝）──────────────────────
  # 慢查询持闸 2s 保证窗口内确定性；被拒 = 闸在查询执行前（连校验都不做）。
  - id: conc-001
    name: 并发超限——同 key 并发 >2 结构化拒绝（key_concurrency_limit）
    modes: [http]
    tool: execute_sql
    key: dev-alice
    concurrency: 3
    args:
      sql: "SELECT pg_sleep(2), count(*) AS n FROM orders"
      dbname: bill
    expect:
      status_multiset:
        success: 2
        rejected: 1
      rejected_reason: key_concurrency_limit
      # 不排队：被拒调用在闸处快速失败（毫秒级），远快于慢查询持闸 2s。
      reject_within_ms: 1000
    replay_skip: true
  - id: conc-002
    name: 并发超限——进程级 >8 结构化拒绝（process_concurrency_limit，5 key × 2）
    modes: [http]
    tool: execute_sql
    keys: [p1, p2, p3, p4, p5]
    concurrency: 2
    args:
      sql: "SELECT pg_sleep(2), count(*) AS n FROM orders"
      dbname: bill
    expect:
      status_multiset:
        success: 8
        rejected: 2
      rejected_reason: process_concurrency_limit
      reject_within_ms: 1000
    replay_skip: true

  # ── §6.3 负向例 5：无指标原料路径 ─────────────────────────────────────
  # 语义仓库（build 13 前）无「支付失败」指标 → Agent 走表/列原料路径成功
  # 产出结果：先确认无现成指标（search_entities type=metric 零命中），再
  # 直查原料表得到答案。
  # build 13 落地后注意：验收环境的语义仓库会注入指标——本用例断言「无
  # 指标」依赖验收环境的语义存储保持为空（run.sh 不 sync 语义数据）。若
  # build 14 需要带语义数据的验收环境，本用例需换「无指标领域」fixture
  # （README 记录该隔离策略），不能依赖全局空存储。
  - id: neg-005
    name: 无指标原料路径——无现成指标，Agent 走表/列原料路径成功产出结果
    modes: [http, stdio]
    key: dev-alice
    steps:
      - tool: search_entities
        args:
          query: "支付失败"
          type: metric
        expect:
          status: success
          paths:
            - path: total
              eq: 0
      - tool: execute_sql
        args:
          sql: "SELECT status, count(*) AS n FROM orders WHERE status = 'refunded' GROUP BY status"
          dbname: bill
        expect:
          status: success
          rows: 1
          truncated: false
          psql_compare: true
