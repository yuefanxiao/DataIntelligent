  # ── 无持库服务（dashboard-backend / ops-operation / usage-collection）
  # 语义元数据用例：服务实体可达 + 拓扑如实（无 contains 边）。数据源 =
  # 验收环境同步的 samples/semantic（run.sh semantic-sync）。
  - id: dash-001
    name: dashboard-backend 简单——服务实体可达（get_entity）
    modes: [http, stdio]
    tool: get_entity
    key: dev-alice
    args:
      fqn: dashboard-backend
    expect:
      status: success
      paths:
        - path: kind
          eq: service
        - path: name
          eq: dashboard-backend
  - id: dash-002
    name: dashboard-backend 简单——服务实体描述（语义内容抽查）
    modes: [http, stdio]
    tool: get_entity
    key: dev-alice
    args:
      fqn: dashboard-backend
    expect:
      status: success
      paths:
        - path: description
          eq: "工作台 BFF——聚合 iam/bss/通知/工单数据的聚合网关（无持库）"
  - id: dash-003
    name: dashboard-backend 复杂——语义拓扑遍历（无持库 = 无 contains 边，如实返回起点）
    modes: [http, stdio]
    tool: traverse_relations
    key: dev-alice
    args:
      fqn: dashboard-backend
      relation: contains
      direction: out
      max_depth: 2
    expect:
      status: success
      paths:
        - path: nodes[0].fqn
          eq: dashboard-backend
        - path: nodes[0].kind
          eq: service
        # 拓扑如实的可检验断言：edges 为空 = 确实无 contains 边（遍历
        # 节点按 FQN 排序，起点是任何后代的前缀恒排首位——仅断言
        # nodes[0].fqn 验不出「无 contains 边」，edges 空数组才闭环）。
        - path: edges
          eq: []
